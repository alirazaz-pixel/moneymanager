<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Manager">
<meta name="theme-color" content="#1D4ED8">
<title>Money Manager</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bl:#1D4ED8;--bl-lt:#EFF6FF;--bl-md:#BFDBFE;--bl-dk:#1E40AF;
  --gn:#15803D;--gn-lt:#F0FDF4;
  --rd:#BE123C;--rd-lt:#FFF1F2;
  --am:#B45309;--am-lt:#FFFBEB;
  --g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;
  --g400:#94A3B8;--g500:#64748B;--g600:#475569;--g900:#0F172A;
  --wh:#FFF;--r:12px;--rsm:8px;
  --sh:0 1px 3px rgba(0,0,0,.07);--shmd:0 4px 20px rgba(0,0,0,.12);
  --f:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--f);background:var(--g50);color:var(--g900);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--f);cursor:pointer}

.nav{background:var(--bl);height:56px;display:flex;align-items:center;padding:0 12px;gap:2px;position:sticky;top:0;z-index:100;box-shadow:var(--shmd)}
.logo{color:#fff;font-weight:700;font-size:15px;margin-right:auto;letter-spacing:-.4px;white-space:nowrap}
.logo small{opacity:.55;font-weight:400;font-size:11px;margin-left:4px}
.ntab{background:none;border:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:500;padding:8px 10px;border-radius:7px;transition:all .15s;white-space:nowrap}
.ntab.on,.ntab:hover{background:rgba(255,255,255,.16);color:#fff}

.sbar{background:var(--am-lt);border-bottom:1px solid #FDE68A;padding:6px 16px;font-size:11px;color:var(--am);display:none;align-items:center;gap:7px;font-weight:500}
.sbar.on{display:flex}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--am);animation:pu 1.3s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}

.page{display:none;padding:14px;max-width:740px;margin:0 auto;padding-bottom:40px}
.page.on{display:block}

.card{background:var(--wh);border-radius:var(--r);border:1px solid var(--g200);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ctit{font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}

.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi{border-radius:var(--rsm);padding:14px 11px;text-align:center}
.kl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.72;margin-bottom:5px}
.kv{font-size:16px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ks{font-size:10px;opacity:.52;margin-top:3px}
.cg{background:var(--gn-lt);color:var(--gn)}
.cr{background:var(--rd-lt);color:var(--rd)}
.ca{background:var(--am-lt);color:var(--am)}
.cb{background:var(--bl-lt);color:var(--bl)}

.sh{font-size:10px;font-weight:700;color:var(--bl);text-transform:uppercase;letter-spacing:.6px;padding:7px 0 5px;border-bottom:2px solid var(--bl-lt);margin-bottom:9px;margin-top:16px}
.sh:first-child{margin-top:0}

.ss{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.st{background:var(--wh);border:1px solid var(--g200);border-radius:var(--rsm);padding:10px 12px;flex:1;min-width:100px;box-shadow:var(--sh)}
.stl{font-size:9px;color:var(--g400);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.stv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{background:var(--bl);color:#fff;padding:9px 10px;text-align:left;font-weight:600;font-size:10px;white-space:nowrap}
.t th:last-child,.t td:last-child{text-align:right}
.t tr:nth-child(even) td{background:var(--g50)}
.t td{padding:8px 10px;border-bottom:1px solid var(--g100);color:var(--g600);vertical-align:middle}
.ti{color:var(--gn)!important;font-weight:600}
.te{color:var(--rd)!important;font-weight:600}
.tn{color:var(--rd)!important;font-weight:700}
.tp{color:var(--gn)!important;font-weight:700}
.tz{color:var(--g400)!important}
.bx{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.bi{background:var(--gn-lt);color:var(--gn)}
.be{background:var(--rd-lt);color:var(--rd)}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.fg.x1{grid-template-columns:1fr}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.4px}
.fl input,.fl select{border:1.5px solid var(--g200);border-radius:var(--rsm);padding:10px 12px;font-size:13px;color:var(--g900);background:var(--wh);transition:border-color .15s;outline:none;-webkit-appearance:none;width:100%}
.fl input:focus,.fl select:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(29,78,216,.1)}

.tt{display:flex;gap:8px;margin-bottom:0}
.ttb{flex:1;padding:11px;border-radius:var(--rsm);border:2px solid var(--g200);font-size:13px;font-weight:700;background:var(--wh);transition:all .15s;text-align:center}
.ttb.e{border-color:var(--rd);background:var(--rd-lt);color:var(--rd)}
.ttb.i{border-color:var(--gn);background:var(--gn-lt);color:var(--gn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:var(--rsm);font-size:13px;font-weight:700;border:none;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.bp{background:var(--bl);color:#fff}.bp:hover{background:var(--bl-dk)}
.bs{background:var(--gn);color:#fff}
.bd{background:var(--rd);color:#fff}
.bg{background:none;border:1.5px solid var(--g200);color:var(--g600)}.bg:hover{border-color:var(--bl);color:var(--bl)}
.bw{width:100%;margin-top:11px;padding:13px;font-size:14px}
.bsm{padding:6px 12px;font-size:11px}

.tabs{display:flex;gap:3px;background:var(--g100);border-radius:var(--rsm);padding:3px;margin-bottom:14px}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:600;border-radius:6px;border:none;background:none;color:var(--g400);font-family:var(--f);transition:all .15s}
.tab.on{background:var(--wh);color:var(--bl);box-shadow:var(--sh)}

.sb2{display:flex;align-items:center;gap:8px;background:var(--wh);border:1.5px solid var(--g200);border-radius:var(--rsm);padding:0 12px;margin-bottom:11px}
.sb2:focus-within{border-color:var(--bl)}
.sb2 input{flex:1;border:none;padding:11px 0;font-size:13px;outline:none;background:none;color:var(--g900)}
.clr{background:none;border:none;color:var(--g400);font-size:22px;cursor:pointer;line-height:1}

.fr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.pill{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--g200);color:var(--g500);cursor:pointer;background:var(--wh);transition:all .15s}
.pill.on{background:var(--bl);border-color:var(--bl);color:#fff}

.rr{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100);gap:10px}
.rr:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.di{background:var(--gn)}.de{background:var(--rd)}
.ri{flex:1;min-width:0}
.rd{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:11px;color:var(--g400);margin-top:2px}
.ra{font-size:13px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}

.mr{display:grid;grid-template-columns:1.2fr 1fr 90px 1fr 28px;gap:5px;align-items:end;margin-bottom:6px;padding:8px;background:var(--g50);border-radius:var(--rsm);border:1px solid var(--g100)}
.mtbar{background:var(--bl-lt);border-radius:var(--rsm);padding:9px 13px;display:flex;justify-content:space-between;font-size:12px;color:var(--bl);font-weight:700;margin-top:8px}

.spsi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.spst{background:var(--g50);border-radius:var(--rsm);padding:10px 12px;border:1px solid var(--g200)}
.spstl{font-size:9px;color:var(--g400);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.spstv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pb{height:7px;background:var(--g100);border-radius:4px;overflow:hidden;margin-bottom:10px}
.pf{height:100%;border-radius:4px;transition:width .3s,background .3s;width:0%;background:var(--bl)}
.sprow{display:grid;grid-template-columns:1.2fr 1fr 90px 28px;gap:5px;align-items:end;margin-bottom:6px;padding:8px;background:var(--g50);border-radius:var(--rsm);border:1px solid var(--g100)}

.mo{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.mb{background:var(--wh);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;box-shadow:var(--shmd);max-height:90vh;overflow-y:auto}
.mbt{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.mclose{background:var(--g100);border:none;border-radius:50%;width:28px;height:28px;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.ma{display:flex;gap:8px;margin-top:14px}
.ma .btn{flex:1}

.ld{position:fixed;inset:0;background:var(--bl);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.ld.hide{opacity:0;pointer-events:none}
.ldi{font-size:56px;margin-bottom:16px}
.ldt{color:#fff;font-size:17px;font-weight:700;margin-bottom:6px}
.lds{color:rgba(255,255,255,.6);font-size:12px;text-align:center;padding:0 20px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--g900);color:#fff;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shmd)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.ci{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--rsm);border:1px solid var(--g100);margin-bottom:6px;background:var(--wh)}

@media(max-width:520px){
  .kg{grid-template-columns:1fr 1fr}
  .kg .kpi:nth-child(3){grid-column:1/-1}
  .mr{grid-template-columns:1fr 1fr 80px 24px}
  .sprow{grid-template-columns:1fr 80px 24px}
  .ntab{padding:7px 8px;font-size:11px}
  .logo small{display:none}
}
</style>
</head>
<body>

<div class="ld" id="ld">
  <div class="ldi">💰</div>
  <div class="ldt">Money Manager</div>
  <div class="lds" id="lds">Loading your data...</div>
</div>

<nav class="nav">
  <span class="logo">💰 Money Manager <small>₨ PKR</small></span>
  <button class="ntab on" onclick="go('dash',this)">Dashboard</button>
  <button class="ntab" onclick="go('entry',this)">+ Add</button>
  <button class="ntab" onclick="go('recs',this)">Records</button>
  <button class="ntab" onclick="go('cats',this)">Categories</button>
  <button class="ntab" onclick="go('cfg',this)">⚙</button>
</nav>
<div class="sbar" id="sbar"><div class="sdot"></div><span id="smsg">Saving...</span></div>
<div class="toast" id="toast"></div>

<!-- DASHBOARD -->
<div class="page on" id="page-dash"><div id="dout"></div></div>

<!-- ENTRY -->
<div class="page" id="page-entry">
  <div class="tabs">
    <button class="tab on" onclick="eTab('single',this)">Single</button>
    <button class="tab" onclick="eTab('multi',this)">Multi-entry</button>
    <button class="tab" onclick="eTab('split',this)">Split cash</button>
  </div>
  <div id="et-single">
    <div class="card">
      <div class="fg x1" style="margin-bottom:11px">
        <div class="tt">
          <button class="ttb e" id="btn-e" onclick="setType('Expense')">− Expense</button>
          <button class="ttb" id="btn-i" onclick="setType('Income')">+ Income</button>
        </div>
      </div>
      <div class="fg">
        <div class="fl"><label>Date</label><input type="date" id="s-dt"></div>
        <div class="fl"><label>Account</label>
          <select id="s-ac"><option>Cash</option><option>Bank</option><option>Credit Card</option></select>
        </div>
      </div>
      <div class="fg">
        <div class="fl"><label>Category</label>
          <select id="s-ct" onchange="fillSubs('s-sb',this.value)"><option value="">Select...</option></select>
        </div>
        <div class="fl"><label>Subcategory</label>
          <select id="s-sb"><option value="">Select...</option></select>
        </div>
      </div>
      <div class="fg">
        <div class="fl"><label>Amount (₨)</label>
          <input type="number" id="s-am" placeholder="0" min="0" inputmode="numeric">
        </div>
        <div class="fl"><label>Note / Description</label>
          <input type="text" id="s-nt" placeholder="e.g. Aylanto, McDonalds...">
        </div>
      </div>
      <button class="btn bp bw" onclick="saveSingle()">✓ &nbsp;Save Entry</button>
    </div>
    <div class="card"><div class="ctit">Last 10 entries</div><div id="recent"></div></div>
  </div>
  <div id="et-multi" style="display:none">
    <div class="card">
      <div class="fg">
        <div class="fl"><label>Date (all)</label><input type="date" id="m-dt"></div>
        <div class="fl"><label>Account</label>
          <select id="m-ac"><option>Cash</option><option>Bank</option><option>Credit Card</option></select>
        </div>
      </div>
      <div id="mrows"></div>
      <button class="btn bg bsm" onclick="addMR()" style="margin-top:6px">+ Add row</button>
      <div class="mtbar"><span>Total:</span><span id="mtot">₨ 0</span></div>
      <button class="btn bp bw" onclick="saveMulti()">✓ &nbsp;Save all entries</button>
    </div>
  </div>
  <div id="et-split" style="display:none">
    <div class="card">
      <div class="fg">
        <div class="fl"><label>Date</label><input type="date" id="sp-dt"></div>
        <div class="fl"><label>Total Cash (₨)</label>
          <input type="number" id="sp-tot" placeholder="e.g. 10000" oninput="calcSp()" min="0" inputmode="numeric">
        </div>
      </div>
      <div class="spsi">
        <div class="spst"><div class="spstl">Allocated</div><div class="spstv te" id="sp-al">₨ 0</div></div>
        <div class="spst"><div class="spstl">Remaining</div><div class="spstv tp" id="sp-rm">₨ 0</div></div>
      </div>
      <div class="pb"><div class="pf" id="sp-pf"></div></div>
      <div id="sprows"></div>
      <button class="btn bg bsm" onclick="addSR()" style="margin-top:6px">+ Add category</button>
      <button class="btn bp bw" onclick="saveSplit()">✓ &nbsp;Save split entries</button>
    </div>
  </div>
</div>

<!-- RECORDS -->
<div class="page" id="page-recs">
  <div class="sb2">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="srch" placeholder="Search note, category, amount..." oninput="renderRecs(true)">
    <button class="clr" onclick="clrS()">×</button>
  </div>
  <div class="fr" id="pills"></div>
  <div id="rstats" style="font-size:11px;color:var(--g400);margin-bottom:9px"></div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="tw">
      <table class="t">
        <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th></tr></thead>
        <tbody id="rbody"></tbody>
      </table>
    </div>
  </div>
  <div style="text-align:center;margin-top:12px">
    <button class="btn bg bsm" id="morebtn" onclick="loadMore()" style="display:none">Load more</button>
  </div>
</div>

<!-- CATEGORIES -->
<div class="page" id="page-cats">
  <div class="card">
    <div class="tabs">
      <button class="tab on" onclick="cTab('list',this)">All</button>
      <button class="tab" onclick="cTab('merge',this)">Merge</button>
      <button class="tab" onclick="cTab('add',this)">Add new</button>
    </div>
    <div id="ct-list"><div id="catbody"></div></div>
    <div id="ct-merge" style="display:none">
      <div class="fg x1" style="margin-bottom:10px">
        <div class="fl"><label>Merge FROM (removed)</label><select id="mf"><option value="">Select...</option></select></div>
      </div>
      <div class="fg x1" style="margin-bottom:10px">
        <div class="fl"><label>Merge INTO (kept)</label><select id="mi"><option value="">Select...</option></select></div>
      </div>
      <div id="mprev" style="display:none;font-size:12px;padding:11px;background:var(--bl-lt);border-radius:var(--rsm);color:var(--bl);margin-bottom:10px"></div>
      <button class="btn bp bw" onclick="mergeCats()">Confirm merge</button>
    </div>
    <div id="ct-add" style="display:none">
      <div class="fl" style="margin-bottom:10px"><label>New category name</label>
        <input type="text" id="newcat" placeholder="e.g. Gym, Travel...">
      </div>
      <button class="btn bs bw" onclick="addCat()">Add category</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-cfg">
  <div class="card">
    <div class="ctit">Google Sheets</div>
    <div style="padding:10px 0;border-bottom:1px solid var(--g100)">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">Status</div>
      <div style="font-size:11px;color:var(--g400)" id="cstat">
        <span style="width:9px;height:9px;border-radius:50%;background:var(--gn);display:inline-block;margin-right:5px;vertical-align:middle"></span>Connected
      </div>
    </div>
    <div style="padding:10px 0">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">Records in Google Sheets</div>
      <div style="font-size:11px;color:var(--g400)" id="sheet-count">Loading...</div>
    </div>
    <button class="btn bp bw" onclick="loadFromSheets()">↓ &nbsp;Reload from Google Sheets</button>
    <button class="btn bg bw" style="margin-top:8px" onclick="exportCSV()">📥 &nbsp;Export CSV (backup)</button>
  </div>
  <div class="card">
    <div class="ctit">Data stats</div>
    <div style="font-size:13px;color:var(--g600);line-height:2">
      Records loaded: <strong id="rcount2">-</strong><br>
      Last sync: <strong id="lastsync">-</strong>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="mo" id="edit-mo" style="display:none" onclick="if(event.target===this)closeMo()">
  <div class="mb">
    <div class="mbt">Edit entry<button class="mclose" onclick="closeMo()">×</button></div>
    <input type="hidden" id="eidx">
    <div class="fg" style="margin-bottom:10px">
      <div class="fl"><label>Date</label><input type="date" id="e-dt"></div>
      <div class="fl"><label>Type</label><select id="e-tp"><option>Expense</option><option>Income</option></select></div>
    </div>
    <div class="fg" style="margin-bottom:10px">
      <div class="fl"><label>Account</label><select id="e-ac"><option>Cash</option><option>Bank</option><option>Credit Card</option></select></div>
      <div class="fl"><label>Amount (₨)</label><input type="number" id="e-am" min="0" inputmode="numeric"></div>
    </div>
    <div class="fg" style="margin-bottom:10px">
      <div class="fl"><label>Category</label>
        <select id="e-ct" onchange="fillSubs('e-sb',this.value)"><option value="">Select...</option></select>
      </div>
      <div class="fl"><label>Subcategory</label><select id="e-sb"><option value="">Select...</option></select></div>
    </div>
    <div class="fg x1" style="margin-bottom:0">
      <div class="fl"><label>Note</label><input type="text" id="e-nt"></div>
    </div>
    <div class="ma">
      <button class="btn bg" onclick="closeMo()">Cancel</button>
      <button class="btn bd bsm" onclick="delEntry()" style="flex:0;padding:11px 16px">Delete</button>
      <button class="btn bp" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
const GS = "https://script.google.com/macros/s/AKfycbzWCulE2nZ_iLmI69hGatdkZsZus2qT4GRKe8Nlupsg7575cUulhYqEt3V7GHF7W2qf0w/exec";
const CAT_SUB = {"Apps": ["Amazon Prime", "Apple Storage", "Cam Scanner", "Chat GPT", "Food Panda", "Google Drive", "HBO", "Linkedin", "Netflix", "Other", "Oura Ring", "Spotify", "YouTube"], "Ayisha": ["Car", "Other Expense", "Pocket Money"], "Bank Charges": ["ATM Charges", "Fee Charges", "Locker Charges"], "Car Expense": ["AC Filter", "AC Service", "Air Filter", "Alignment ", "Balancing ", "Battery", "Engine Oil", "Labor", "Lights", "Maintenance ", "Mats", "Number Plate", "Oil Filter", "Other", "Polish and Wax", "Repairing", "Shades", "Token Tax", "Tyre", "Washing", "Wipers"], "Car Installment": ["Swift"], "Careem": [], "Cigarettes": ["E-cigarettes ", "Regular "], "Club": ["Membership"], "Doctor": ["Family", "Kids", "Me"], "Eid": ["Bakra", "family", "others", "servants"], "Electricty Bill": [], "Electronics": ["Computer", "Computer Accessories", "Mobile", "Mobile Accessories", "Other"], "Extra Income": [], "Family": ["Food", "Other ", "Petrol"], "Family Trip": ["Food", "Gifts", "Hotel", "Other", "Petrol", "Tickets"], "Food": ["Family ", "Personal"], "Friends": ["Food", "Gifts", "Other"], "Fun ": ["Movies", "Other"], "GM": ["MFEE", "Other"], "Gift": ["Family", "Others", "Parents"], "Grocery": ["Milk", "Other"], "Household": ["AC Repair", "Air Conditioner (AC)", "Bulbs", "Cooler", "Electrician", "Fittings", "Geezer", "Other", "Paint", "Washroom"], "Kids": ["Birthdays ", "Cloths", "Other", "Qari Shb", "Reading Books ", "Toys"], "Medicine": ["Masks", "Medicines", "Tests"], "Mobile": ["Onic", "Telenor", "Ufone", "Zong"], "Office": ["Clients", "Food", "Other", "Peon"], "Other": [], "Parking": ["parking ", "toll"], "Personal": ["Cloths", "Dhobi", "Hair Cut", "Other ", "Personal Care"], "Petrol": ["High Octane", "Regular"], "Sadka": ["Random", "Sadka"], "Salary": [], "Sanitizer & Cleaner": [], "Savings": ["Personal"], "School Expense": ["Books & Stationary", "Canteen", "Other", "Uniform & Cloths"], "School Fee": ["Annaya", "Miraal"], "Servants": ["Asma", "Other"], "Zakat": []};
let DB = [];
let curType = 'Expense';
let rOff = 0;
const PG = 60;
let filt = {yr:'all',tp:'all'};

// FORMAT
const pkr = n => '₨ ' + Math.abs(n).toLocaleString('en-PK',{maximumFractionDigits:0});
const netFmt = n => n<0 ? '('+pkr(n)+')' : n>0 ? '+'+pkr(n) : '₨ 0';
const fmtD = d => new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const today = () => new Date().toISOString().split('T')[0];

// TOAST
let tT;
function toast(m,d=2400){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),d);}
function showSync(m){document.getElementById('smsg').textContent=m;document.getElementById('sbar').classList.add('on');}
function hideSync(){document.getElementById('sbar').classList.remove('on');}

// INIT
window.onload = async () => {
  fillCatSel('s-ct');fillCatSel('e-ct');fillCatSel('mf');fillCatSel('mi');
  setDates();
  document.getElementById('mf').addEventListener('change',mPrev);
  document.getElementById('mi').addEventListener('change',mPrev);
  await loadFromSheets();
};

function setDates(){const t=today();['s-dt','m-dt','sp-dt'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=t;});}

// NAV
function go(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('on'));
  document.getElementById('page-'+id).classList.add('on');el.classList.add('on');
  if(id==='dash')renderDash();
  if(id==='entry'){renderRecent();setDates();}
  if(id==='recs'){rOff=0;renderPills();renderRecs(true);}
  if(id==='cats')renderCats();
}
function closeMo(){document.getElementById('edit-mo').style.display='none';}

// LOAD FROM SHEETS — GET request, no CORS issue
async function loadFromSheets(){
  document.getElementById('lds').textContent='Loading from Google Sheets...';
  try {
    const res = await fetch(GS+'?action=read');
    const data = await res.json();
    if(data.status==='ok' && data.data && data.data.length>1){
      const h=data.data[0];
      const di=h.indexOf('Date'),ti=h.indexOf('Type'),ai=h.indexOf('Account');
      const ci=h.indexOf('Category'),si=h.indexOf('Subcategory'),mi=h.indexOf('Amount'),ni=h.indexOf('Note');
      DB=data.data.slice(1).map(r=>({
        date:(function(d){
          if(!d) return '';
          var s = String(d);
          // Handle ISO timestamp: 2026-05-26T19:00:00.000Z
          if(s.includes('T')) return s.substring(0,10);
          // Handle date object stringified
          if(s.length >= 10) return s.substring(0,10);
          return '';
        })(r[di]),
        type:String(r[ti]),
        account:String(r[ai]||'Cash'),
        category:String(r[ci]||''),
        subcategory:String(r[si]||''),
        amount:parseFloat(r[mi])||0,
        note:String(r[ni]||'')
      })).filter(r=>r.amount>0&&r.date&&r.date!=='undefined');
      DB.sort((a,b)=>b.date.localeCompare(a.date));
      document.getElementById('sheet-count').textContent=DB.length.toLocaleString()+' records';
      document.getElementById('rcount2').textContent=DB.length.toLocaleString();
      document.getElementById('lastsync').textContent=new Date().toLocaleTimeString();
    }
  } catch(e) {
    console.log('Load error:',e);
  }
  renderDash();renderRecent();
  setTimeout(()=>{
    document.getElementById('ld').classList.add('hide');
    setTimeout(()=>document.getElementById('ld').style.display='none',500);
  },600);
}

// SAVE SINGLE ENTRY — GET request with params (no CORS!)
async function saveToSheets(rec){
  showSync('Saving to Google Sheets...');
  try {
    const params = new URLSearchParams({
      action:'append',
      date:rec.date,
      type:rec.type,
      account:rec.account,
      category:rec.category,
      subcategory:rec.subcategory||'',
      amount:rec.amount,
      note:rec.note||''
    });
    const res = await fetch(GS+'?'+params.toString());
    const data = await res.json();
    if(data.status==='ok'){
      hideSync();
      return true;
    }
  } catch(e){
    console.log('Save error:',e);
  }
  hideSync();
  return false;
}

// CAT SELECTS
function fillCatSel(id){
  const s=document.getElementById(id);if(!s)return;
  s.innerHTML='<option value="">Select...</option>';
  Object.keys(CAT_SUB).sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o);});
}
function fillSubs(id,cat){
  const s=document.getElementById(id);if(!s)return;
  s.innerHTML='<option value="">Select...</option>';
  (CAT_SUB[cat]||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
}

// TYPE
function setType(tp){
  curType=tp;
  document.getElementById('btn-e').className='ttb'+(tp==='Expense'?' e':'');
  document.getElementById('btn-i').className='ttb'+(tp==='Income'?' i':'');
}

// SINGLE ENTRY
async function saveSingle(){
  const dt=document.getElementById('s-dt').value;
  const ac=document.getElementById('s-ac').value;
  const ct=document.getElementById('s-ct').value;
  const sb=document.getElementById('s-sb').value;
  const am=parseFloat(document.getElementById('s-am').value);
  const nt=document.getElementById('s-nt').value.trim();
  if(!dt||!ct||!am||am<=0){toast('Please fill Date, Category and Amount');return;}
  const rec={date:dt,type:curType,account:ac,category:ct,subcategory:sb,amount:am,note:nt};
  DB.unshift(rec);
  document.getElementById('s-am').value='';
  document.getElementById('s-nt').value='';
  renderRecent();
  const ok = await saveToSheets(rec);
  toast(ok ? 'Saved to Google Sheets ✓' : 'Saved locally (check connection)');
}

// RECENT
function renderRecent(){
  const el=document.getElementById('recent');
  const items=DB.slice(0,10);
  if(!items.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--g400)">No entries yet</div>';return;}
  el.innerHTML=items.map((r,i)=>`
    <div class="rr">
      <div class="dot ${r.type==='Income'?'di':'de'}"></div>
      <div class="ri">
        <div class="rd">${r.note||r.category}</div>
        <div class="rm">${r.category}${r.subcategory?' · '+r.subcategory:''} · ${fmtD(r.date)}</div>
      </div>
      <div class="ra" style="color:${r.type==='Income'?'var(--gn)':'var(--rd)'}">${r.type==='Income'?'+':'-'}${pkr(r.amount)}</div>
      <button class="btn bg bsm" onclick="openEdit(${i})" style="padding:5px 9px">✎</button>
    </div>`).join('');
}

// MULTI
function eTab(id,el){
  ['single','multi','split'].forEach(t=>document.getElementById('et-'+t).style.display='none');
  document.querySelectorAll('#page-entry .tabs .tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('et-'+id).style.display='block';el.classList.add('on');
  if(id==='multi'&&!document.getElementById('mrows').children.length){addMR();addMR();addMR();}
  if(id==='split'&&!document.getElementById('sprows').children.length){addSR();addSR();addSR();}
}
function addMR(){
  const d=document.createElement('div');d.className='mr';
  const cats=Object.keys(CAT_SUB).sort().map(c=>`<option>${c}</option>`).join('');
  d.innerHTML=`
    <div class="fl"><label style="font-size:9px">Category</label>
      <select style="font-size:12px;padding:7px" onchange="mRowSub(this)">
        <option value="">Select...</option>${cats}</select></div>
    <div class="fl"><label style="font-size:9px">Subcategory</label>
      <select class="msub" style="font-size:12px;padding:7px"><option value="">—</option></select></div>
    <div class="fl"><label style="font-size:9px">Amount</label>
      <input type="number" class="mamt" min="0" placeholder="0" oninput="calcMT()" style="font-size:12px;padding:7px" inputmode="numeric"></div>
    <div class="fl"><label style="font-size:9px">Note</label>
      <input type="text" placeholder="Description" style="font-size:12px;padding:7px"></div>
    <button onclick="this.closest('.mr').remove();calcMT()" style="background:var(--rd-lt);border:none;border-radius:6px;color:var(--rd);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;align-self:flex-end;flex-shrink:0">×</button>`;
  document.getElementById('mrows').appendChild(d);
}
function mRowSub(sel){
  const sub=sel.closest('.mr').querySelector('.msub');
  sub.innerHTML='<option value="">—</option>';
  (CAT_SUB[sel.value]||[]).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sub.appendChild(o);});
}
function calcMT(){
  let t=0;document.querySelectorAll('.mamt').forEach(i=>t+=parseFloat(i.value)||0);
  document.getElementById('mtot').textContent=pkr(t);
}
async function saveMulti(){
  const dt=document.getElementById('m-dt').value;
  const ac=document.getElementById('m-ac').value;
  const recs=[];
  document.querySelectorAll('.mr').forEach(row=>{
    const ss=row.querySelectorAll('select');
    const ii=row.querySelectorAll('input');
    const ct=ss[0].value,sb=ss[1].value;
    const am=parseFloat(ii[0].value),nt=ii[1].value.trim();
    if(ct&&am>0)recs.push({date:dt,type:'Expense',account:ac,category:ct,subcategory:sb,amount:am,note:nt});
  });
  if(!recs.length){toast('No valid entries');return;}
  recs.forEach(r=>DB.unshift(r));
  showSync('Saving '+recs.length+' entries...');
  let saved=0;
  for(const r of recs){
    const ok=await saveToSheets(r);
    if(ok)saved++;
  }
  hideSync();
  toast(saved+' entries saved ✓');
  document.getElementById('mrows').innerHTML='';
  addMR();addMR();addMR();calcMT();
  renderRecent();
}

// SPLIT
function addSR(){
  const d=document.createElement('div');d.className='sprow';
  const cats=Object.keys(CAT_SUB).sort().map(c=>`<option>${c}</option>`).join('');
  d.innerHTML=`
    <div class="fl"><label style="font-size:9px">Category</label>
      <select style="font-size:12px;padding:7px"><option value="">Select...</option>${cats}</select></div>
    <div class="fl"><label style="font-size:9px">Note</label>
      <input type="text" placeholder="Description" style="font-size:12px;padding:7px"></div>
    <div class="fl"><label style="font-size:9px">Amount</label>
      <input type="number" class="samt" min="0" placeholder="0" oninput="calcSp()" style="font-size:12px;padding:7px" inputmode="numeric"></div>
    <button onclick="this.closest('.sprow').remove();calcSp()" style="background:var(--rd-lt);border:none;border-radius:6px;color:var(--rd);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;align-self:flex-end;flex-shrink:0">×</button>`;
  document.getElementById('sprows').appendChild(d);
}
function calcSp(){
  const tot=parseFloat(document.getElementById('sp-tot').value)||0;
  let al=0;document.querySelectorAll('.samt').forEach(i=>al+=parseFloat(i.value)||0);
  const rm=tot-al;
  const pct=tot>0?Math.min(100,Math.round(al/tot*100)):0;
  document.getElementById('sp-al').textContent=pkr(al);
  document.getElementById('sp-rm').textContent=rm<0?'('+pkr(Math.abs(rm))+')':pkr(rm);
  document.getElementById('sp-rm').className='spstv '+(rm<0?'tn':'tp');
  document.getElementById('sp-pf').style.width=pct+'%';
  document.getElementById('sp-pf').style.background=rm<0?'var(--rd)':'var(--bl)';
}
async function saveSplit(){
  const dt=document.getElementById('sp-dt').value;
  const recs=[];
  document.querySelectorAll('.sprow').forEach(row=>{
    const ct=row.querySelector('select').value;
    const ii=row.querySelectorAll('input');
    const nt=ii[0].value.trim(),am=parseFloat(ii[1].value);
    if(ct&&am>0)recs.push({date:dt,type:'Expense',account:'Cash',category:ct,subcategory:'',amount:am,note:nt});
  });
  if(!recs.length){toast('No valid entries');return;}
  recs.forEach(r=>DB.unshift(r));
  showSync('Saving split entries...');
  for(const r of recs) await saveToSheets(r);
  hideSync();
  toast(recs.length+' split entries saved ✓');
  document.getElementById('sprows').innerHTML='';
  document.getElementById('sp-tot').value='';
  addSR();addSR();addSR();calcSp();
  renderRecent();
}

// DASHBOARD
function sumDB(tp,yr,mo){
  return DB.filter(r=>{
    if(tp&&r.type!==tp)return false;
    const d=new Date(r.date+'T00:00:00');
    if(yr&&d.getFullYear()!==yr)return false;
    if(mo&&d.getMonth()+1!==mo)return false;
    return true;
  }).reduce((s,r)=>s+r.amount,0);
}
function renderDash(){
  const now=new Date();const Y=now.getFullYear();const Mo=now.getMonth()+1;
  const day=now.getDate();const dInMo=new Date(Y,Mo,0).getDate();
  const mName=now.toLocaleString('en',{month:'long'})+' '+Y;
  const mtdI=sumDB('Income',Y,Mo),mtdE=sumDB('Expense',Y,Mo),mtdN=mtdI-mtdE;
  const ytdI=sumDB('Income',Y,null),ytdE=sumDB('Expense',Y,null),ytdN=ytdI-ytdE;
  const allI=sumDB('Income',null,null),allE=sumDB('Expense',null,null),allN=allI-allE;
  const dAvg=day>0?Math.round(mtdE/day):0;
  const proj=Math.round(dAvg*dInMo);
  function kpi(l,v,c,s){return`<div class="kpi ${c}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`;}
  const months=[];let cy=Y,cm=Mo;
  for(let i=0;i<24;i++){months.push({y:cy,m:cm});cm--;if(cm===0){cm=12;cy--;}}
  const mRows=months.map(({y,m})=>{
    const lb=new Date(y,m-1,1).toLocaleString('en',{month:'short',year:'numeric'});
    const i=sumDB('Income',y,m),e=sumDB('Expense',y,m),n=i-e;
    if(i===0&&e===0)return'';
    return`<tr><td>${lb}</td><td class="ti">${pkr(i)}</td><td class="te">${pkr(e)}</td><td class="${n<0?'tn':n>0?'tp':'tz'}">${netFmt(n)}</td></tr>`;
  }).filter(Boolean).join('');
  const catMo={};
  DB.filter(r=>{const d=new Date(r.date+'T00:00:00');return r.type==='Expense'&&d.getFullYear()===Y&&d.getMonth()+1===Mo;})
    .forEach(r=>{catMo[r.category]=(catMo[r.category]||0)+r.amount;});
  const topMo=Object.entries(catMo).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const catAll={};
  DB.filter(r=>r.type==='Expense').forEach(r=>{catAll[r.category]=(catAll[r.category]||0)+r.amount;});
  const topAll=Object.entries(catAll).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const yrs=[...new Set(DB.map(r=>new Date(r.date+'T00:00:00').getFullYear()))].sort((a,b)=>b-a);
  const yrRows=yrs.map(y=>{
    const i=sumDB('Income',y,null),e=sumDB('Expense',y,null),n=i-e;
    return`<tr><td><strong>${y}</strong></td><td class="ti">${pkr(i)}</td><td class="te">${pkr(e)}</td><td class="${n<0?'tn':n>0?'tp':'tz'}">${netFmt(n)}</td></tr>`;
  }).join('');
  document.getElementById('dout').innerHTML=`
    <div class="sh">Month to date · ${mName}</div>
    <div class="kg">
      ${kpi('MTD Income',pkr(mtdI),'cg','Received')}
      ${kpi('MTD Expense',pkr(mtdE),'cr','Spent')}
      ${kpi('MTD Remaining',netFmt(mtdN),mtdN<0?'cr':'ca',mtdN<0?'Over budget':'Left')}
    </div>
    <div class="ss">
      <div class="st"><div class="stl">Daily avg</div><div class="stv" style="color:var(--rd)">${pkr(dAvg)}<small style="font-size:10px;font-weight:400;color:var(--g400)">/day</small></div></div>
      <div class="st"><div class="stl">Projection</div><div class="stv" style="color:var(--am)">${pkr(proj)}</div></div>
      <div class="st"><div class="stl">Day ${day}/${dInMo}</div><div class="stv" style="color:var(--bl)">${Math.round(day/dInMo*100)}%</div></div>
    </div>
    <div class="sh">Year to date · ${Y}</div>
    <div class="kg">
      ${kpi('YTD Income',pkr(ytdI),'cg',Y)}
      ${kpi('YTD Expense',pkr(ytdE),'cr',Y)}
      ${kpi('YTD Net',netFmt(ytdN),ytdN<0?'cr':'ca',ytdN<0?'Deficit':'Surplus')}
    </div>
    <div class="sh">All time</div>
    <div class="kg">
      ${kpi('Total Income',pkr(allI),'cg','Since Sep 2021')}
      ${kpi('Total Expense',pkr(allE),'cr','Since Sep 2021')}
      ${kpi('Net Balance',netFmt(allN),allN<0?'cr':'ca','Running total')}
    </div>
    <div class="sh">Top expenses · ${now.toLocaleString('en',{month:'long'})}</div>
    <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table class="t">
      <thead><tr><th>Category</th><th>Txns</th><th>Amount</th></tr></thead>
      <tbody>${topMo.map(([c,a])=>{
        const cnt=DB.filter(r=>{const d=new Date(r.date+'T00:00:00');return r.type==='Expense'&&r.category===c&&d.getFullYear()===Y&&d.getMonth()+1===Mo;}).length;
        return`<tr><td>${c}</td><td style="text-align:center;color:var(--g400)">${cnt}</td><td class="te">${pkr(a)}</td></tr>`;
      }).join('')}</tbody>
    </table></div></div>
    <div class="sh">Top expenses · all time</div>
    <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table class="t">
      <thead><tr><th>Category</th><th>Txns</th><th>Amount</th></tr></thead>
      <tbody>${topAll.map(([c,a])=>{
        const cnt=DB.filter(r=>r.type==='Expense'&&r.category===c).length;
        return`<tr><td>${c}</td><td style="text-align:center;color:var(--g400)">${cnt}</td><td class="te">${pkr(a)}</td></tr>`;
      }).join('')}</tbody>
    </table></div></div>
    <div class="sh">Monthly breakdown</div>
    <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table class="t">
      <thead><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead>
      <tbody>${mRows}</tbody>
    </table></div></div>
    <div class="sh">Yearly comparison</div>
    <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table class="t">
      <thead><tr><th>Year</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead>
      <tbody>${yrRows}</tbody>
    </table></div></div>`;
}

// RECORDS
function renderPills(){
  const yrs=[...new Set(DB.map(r=>new Date(r.date+'T00:00:00').getFullYear()))].sort((a,b)=>b-a);
  document.getElementById('pills').innerHTML=
    `<div class="pill on" onclick="setF('tp','all',this)">All</div>
     <div class="pill" onclick="setF('tp','Income',this)">Income</div>
     <div class="pill" onclick="setF('tp','Expense',this)">Expense</div>
     ${yrs.map(y=>`<div class="pill" onclick="setF('yr','${y}',this)">${y}</div>`).join('')}`;
}
function setF(k,v,el){filt[k]=v;rOff=0;document.querySelectorAll('.fr .pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');renderRecs(true);}
function getFiltered(){
  const q=document.getElementById('srch').value.toLowerCase().trim();
  return DB.filter(r=>{
    const d=new Date(r.date+'T00:00:00');
    const yo=filt.yr==='all'||d.getFullYear()===parseInt(filt.yr);
    const to=filt.tp==='all'||r.type===filt.tp;
    const so=!q||(r.note||'').toLowerCase().includes(q)||(r.category||'').toLowerCase().includes(q)||(r.subcategory||'').toLowerCase().includes(q)||String(r.amount).includes(q)||(r.date||'').includes(q);
    return yo&&to&&so;
  });
}
function renderRecs(reset){
  if(reset)rOff=0;
  const f=getFiltered();const sl=f.slice(0,rOff+PG);
  const tI=f.filter(r=>r.type==='Income').reduce((s,r)=>s+r.amount,0);
  const tE=f.filter(r=>r.type==='Expense').reduce((s,r)=>s+r.amount,0);
  document.getElementById('rstats').innerHTML=`${f.length.toLocaleString()} records · <span style="color:var(--gn);font-weight:600">${pkr(tI)}</span> in · <span style="color:var(--rd);font-weight:600">${pkr(tE)}</span> out`;
  document.getElementById('rbody').innerHTML=sl.map(r=>`
    <tr onclick="openEdit(${DB.indexOf(r)})" style="cursor:pointer">
      <td style="white-space:nowrap;font-size:11px">${fmtD(r.date)}</td>
      <td><span class="bx ${r.type==='Income'?'bi':'be'}">${r.type==='Income'?'Inc':'Exp'}</span></td>
      <td style="font-size:12px">${r.category}${r.subcategory?`<br><small style="color:var(--g400);font-size:10px">${r.subcategory}</small>`:''}</td>
      <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${r.note||'—'}</td>
      <td class="${r.type==='Income'?'ti':'te'}" style="font-size:12px">${r.type==='Income'?'+':'-'}${pkr(r.amount)}</td>
    </tr>`).join('');
  document.getElementById('morebtn').style.display=sl.length<f.length?'inline-flex':'none';
  rOff=sl.length;
}
function loadMore(){renderRecs(false);}
function clrS(){document.getElementById('srch').value='';renderRecs(true);}

// EDIT/DELETE
function openEdit(idx){
  const r=DB[idx];
  document.getElementById('eidx').value=idx;
  document.getElementById('e-dt').value=r.date;
  document.getElementById('e-tp').value=r.type;
  document.getElementById('e-ac').value=r.account||'Cash';
  document.getElementById('e-am').value=r.amount;
  fillCatSel('e-ct');document.getElementById('e-ct').value=r.category;
  fillSubs('e-sb',r.category);document.getElementById('e-sb').value=r.subcategory||'';
  document.getElementById('e-nt').value=r.note||'';
  document.getElementById('edit-mo').style.display='flex';
}
async function saveEdit(){
  const idx=parseInt(document.getElementById('eidx').value);
  const oldRec = DB[idx];
  const newRec = {
    date:document.getElementById('e-dt').value,
    type:document.getElementById('e-tp').value,
    account:document.getElementById('e-ac').value,
    category:document.getElementById('e-ct').value,
    subcategory:document.getElementById('e-sb').value,
    amount:parseFloat(document.getElementById('e-am').value)||0,
    note:document.getElementById('e-nt').value.trim()
  };
  DB[idx]=newRec;
  closeMo();
  renderRecent();renderRecs(true);
  showSync('Updating Google Sheets...');
  try {
    // Delete old record
    const delParams = new URLSearchParams({
      action:'delete',
      date:oldRec.date,
      type:oldRec.type,
      category:oldRec.category,
      amount:oldRec.amount,
      note:oldRec.note||''
    });
    await fetch(GS+'?'+delParams.toString());
    // Add new record
    await saveToSheets(newRec);
    hideSync();
    toast('Updated ✓');
  } catch(e){
    hideSync();
    toast('Updated locally');
  }
}
async function delEntry(){
  const idx=parseInt(document.getElementById('eidx').value);
  if(!confirm('Delete this entry permanently?'))return;
  const rec = DB[idx];
  DB.splice(idx,1);
  closeMo();
  renderRecent();renderRecs(true);
  // Delete from Google Sheets by finding matching row
  showSync('Deleting from Google Sheets...');
  try {
    const params = new URLSearchParams({
      action:'delete',
      date:rec.date,
      type:rec.type,
      category:rec.category,
      amount:rec.amount,
      note:rec.note||''
    });
    const res = await fetch(GS+'?'+params.toString());
    const data = await res.json();
    if(data.status==='ok'){
      hideSync();
      toast('Deleted ✓');
    } else {
      hideSync();
      toast('Deleted locally — refresh to sync');
    }
  } catch(e){
    hideSync();
    toast('Deleted locally — refresh to sync');
  }
}

// CATEGORIES
function cTab(id,el){
  ['list','merge','add'].forEach(t=>document.getElementById('ct-'+t).style.display='none');
  document.querySelectorAll('#page-cats .tabs .tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('ct-'+id).style.display='block';el.classList.add('on');
  if(id==='list')renderCats();
}
function renderCats(){
  const tots={};
  DB.forEach(r=>{if(!tots[r.category])tots[r.category]={c:0,t:0};tots[r.category].c++;tots[r.category].t+=r.amount;});
  document.getElementById('catbody').innerHTML=Object.entries(tots).sort((a,b)=>b[1].t-a[1].t).map(([c,d])=>`
    <div class="ci">
      <div><div style="font-size:13px;font-weight:500">${c}</div><div style="font-size:11px;color:var(--g400)">${d.c.toLocaleString()} records · ${pkr(d.t)}</div></div>
      <button class="btn bg bsm" onclick="renameCat('${c.replace(/'/g,"\'")}')">Rename</button>
    </div>`).join('');
}
function renameCat(cat){
  const n=prompt('Rename "'+cat+'" to:',cat);
  if(!n||!n.trim()||n.trim()===cat)return;
  const nn=n.trim();
  DB.forEach(r=>{if(r.category===cat)r.category=nn;});
  if(CAT_SUB[cat]){CAT_SUB[nn]=CAT_SUB[cat];delete CAT_SUB[cat];}
  toast('"'+cat+'" renamed ✓');renderCats();fillCatSel('s-ct');fillCatSel('e-ct');fillCatSel('mf');fillCatSel('mi');
}
function mPrev(){
  const f=document.getElementById('mf').value,i=document.getElementById('mi').value;
  const p=document.getElementById('mprev');
  if(f&&i&&f!==i){
    const fc=DB.filter(r=>r.category===f).length,ic=DB.filter(r=>r.category===i).length;
    p.style.display='block';
    p.innerHTML=`<strong>${fc}</strong> records from <strong>${f}</strong> → <strong>${i}</strong> (${ic} records)`;
  }else p.style.display='none';
}
function mergeCats(){
  const f=document.getElementById('mf').value,i=document.getElementById('mi').value;
  if(!f||!i||f===i){toast('Select two different categories');return;}
  DB.forEach(r=>{if(r.category===f)r.category=i;});
  if(CAT_SUB[f]){CAT_SUB[i]=[...new Set([...(CAT_SUB[i]||[]),...CAT_SUB[f]])].sort();delete CAT_SUB[f];}
  toast('"'+f+'" merged into "'+i+'" ✓');renderCats();fillCatSel('s-ct');fillCatSel('mf');fillCatSel('mi');
}
function addCat(){
  const n=document.getElementById('newcat').value.trim();
  if(!n){toast('Enter a name');return;}
  if(CAT_SUB[n]){toast('Already exists');return;}
  CAT_SUB[n]=[];fillCatSel('s-ct');fillCatSel('e-ct');
  document.getElementById('newcat').value='';
  toast('"'+n+'" added ✓');renderCats();
}

// EXPORT
function exportCSV(){
  const hdr='Date,Type,Account,Category,Subcategory,Amount,Note';
  const rows=DB.map(r=>[r.date,r.type,r.account,r.category,r.subcategory,r.amount,'"'+(r.note||'')+'"'].join(','));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent([hdr,...rows].join('\n'));
  a.download='MoneyManager_'+today()+'.csv';
  a.click();toast('CSV exported ✓');
}

// SERVICE WORKER
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
